<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Featured project previews</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap">
<style>
  :root {
    --charcoal: #1a1815;
    --surface: #262320;
    --cream: #f0eee6;
    --terracotta: #d97757;
    --sage: #9dae7b;
    --slate: #6a8cae;
    --line: rgb(240 238 230 / 15%);
    --display: Poppins, sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--charcoal); color: var(--cream); }
  [hidden] { display: none !important; }

  .preview {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    width: 1600px;
    height: 1000px;
    padding: 108px 104px;
  }

  .terrain {
    position: absolute;
    z-index: -1;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: .25;
  }

  h1 {
    display: flex;
    align-items: center;
    gap: 26px;
    margin: 0;
    font: 600 60px/1.2 var(--display);
  }

  h1::before {
    content: "";
    width: 52px;
    height: 8px;
    border-radius: 4px;
    background: var(--terracotta);
  }

  .art {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 700px;
  }

  .gift { width: 936px; }
  .connection { gap: 56px; }
  .translation { gap: 46px; }

  .tile {
    display: grid;
    place-items: center;
    width: 310px;
    height: 310px;
    border: 3px solid var(--line);
    border-radius: 64px;
    background: var(--surface);
  }

  .tile img { width: 156px; height: 156px; object-fit: contain; }
  .translation .tile { width: 256px; height: 256px; border-radius: 54px; }
  .translation .tile img { width: 154px; height: 154px; }

  .arrow {
    display: block;
    width: 170px;
    overflow: visible;
    fill: none;
    stroke: var(--sage);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .sparkle { fill: var(--terracotta); stroke: none; }
  .plus { color: var(--slate); font: 600 52px/1 var(--display); }
</style>
</head>
<body>
<section class="preview" id="revel">
  <img class="terrain" src="terrain-a.svg" alt="">
  <h1>Still a surprise.</h1>
  <div class="art">
    <img class="gift" src="marks/revel-hero.svg" alt="Two assistants exchange a detail that helps someone choose a gift">
  </div>
</section>

<section class="preview" id="spotify-mcp-server" hidden>
  <img class="terrain" src="terrain-b.svg" alt="">
  <h1>Self-hosted integration</h1>
  <div class="art connection">
    <div class="tile"><img src="marks/mcp.svg" alt="Model Context Protocol"></div>
    <svg class="arrow" viewBox="0 0 170 70" aria-hidden="true">
      <path d="M5 35h156m-23-22 23 22-23 22"/>
    </svg>
    <div class="tile"><img src="marks/spotify.svg" alt="Spotify API"></div>
  </div>
</section>

<section class="preview" id="numpy-to-rust-eval" hidden>
  <img class="terrain" src="terrain-c.svg" alt="">
  <h1>AI translation eval</h1>
  <div class="art translation">
    <div class="tile"><img src="marks/python.svg" alt="Python"></div>
    <span class="plus" aria-hidden="true">+</span>
    <div class="tile"><img src="marks/numpy.svg" alt="NumPy"></div>
    <svg class="arrow" viewBox="0 0 170 150" role="img" aria-label="translated to">
      <path d="M5 75h156m-23-22 23 22-23 22"/>
      <path class="sparkle" d="M77 0q0 27 26 28-26 1-26 28-1-27-26-28Q76 27 77 0ZM112 6q1 13 13 13-12 1-13 14-1-13-13-14 12 0 13-13Z"/>
    </svg>
    <div class="tile"><img src="marks/rust.svg" alt="Rust"></div>
  </div>
</section>

<script>
  const sections = document.querySelectorAll(".preview");
  function selectPreview() {
    const selected = document.getElementById(location.hash.slice(1));
    for (const section of sections) {
      section.hidden = section !== (selected?.matches(".preview") ? selected : sections[0]);
    }
  }
  selectPreview();
  window.addEventListener("hashchange", selectPreview);
</script>
</body>
</html>
